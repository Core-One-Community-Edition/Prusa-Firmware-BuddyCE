name: CI

on:
  pull_request:
  push:
    branches:
      - devel
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  esp-firmware:
    name: ESP NIC firmware (${{ matrix.chip }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Core One uses the esp8266 NIC; add esp32 (sdk_export: /esp-idf/export.sh)
        # here if esp32-based builds are ever needed again.
        include:
          - chip: esp8266
            sdk_export: /ESP8266_RTOS_SDK/export.sh
    steps:
      - uses: actions/checkout@v4

      # If the NIC sources are unchanged, reuse the previously built binaries
      # and skip the Docker build entirely.
      - name: Restore built firmware cache
        id: fw-cache
        uses: actions/cache@v4
        with:
          path: esp-fw-output
          key: esp-fw-${{ matrix.chip }}-${{ hashFiles(format('lib/{0}-nic/**', matrix.chip)) }}

      - name: Restore SDK Docker image cache
        if: steps.fw-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/buddy-${{ matrix.chip }}-nic-build.tar.zst
          key: esp-docker-${{ matrix.chip }}-${{ hashFiles(format('lib/{0}-nic/Dockerfile', matrix.chip)) }}

      - name: Load or build SDK Docker image
        if: steps.fw-cache.outputs.cache-hit != 'true'
        run: |
          image_tar="/tmp/buddy-${{ matrix.chip }}-nic-build.tar.zst"
          if [ -f "$image_tar" ]; then
            zstd -d --stdout "$image_tar" | docker load
          else
            docker build -t "buddy-${{ matrix.chip }}-nic-build" "lib/${{ matrix.chip }}-nic"
            docker save "buddy-${{ matrix.chip }}-nic-build" | zstd -T0 -o "$image_tar"
          fi

      # Mirrors the container invocation in lib/AddEspNicFw.cmake.
      - name: Build ESP NIC firmware
        if: steps.fw-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p esp-build esp-fw-output
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/lib/${{ matrix.chip }}-nic:/project" \
            -v "$PWD/esp-build:/build" \
            "buddy-${{ matrix.chip }}-nic-build" bash -c \
            "source ${{ matrix.sdk_export }} && cmake -DIDF_TARGET=${{ matrix.chip }} -B /build -S /project && cmake --build /build"
          cp esp-build/uart_wifi.bin esp-fw-output/
          cp esp-build/bootloader/bootloader.bin esp-fw-output/
          cp esp-build/partition_table/partition-table.bin esp-fw-output/

      # The esp8266 flasher stub comes from a separate pre-built esptool repo
      # (see lib/AddEspNicFw.cmake); include it so the artifact is self-contained.
      - name: Add esp8266 flasher stubs
        if: matrix.chip == 'esp8266'
        run: cp src/resources/esp8266/stub_text.bin src/resources/esp8266/stub_data.bin esp-fw-output/

      - name: Upload ESP NIC firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-${{ matrix.chip }}-firmware
          path: esp-fw-output/
          if-no-files-found: error

  firmware:
    name: Firmware (coreone)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: esp-firmware
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
      bbf_artifact_url: ${{ steps.upload_bbf.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjpeg-dev gettext

      - name: Get Python version
        id: python
        run: echo "version=$(python3 -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" >> "$GITHUB_OUTPUT"

      - name: Cache buddy dependencies
        uses: actions/cache@v4
        with:
          path: .dependencies
          key: buddy-deps-${{ runner.os }}-${{ hashFiles('utils/bootstrap.py') }}

      - name: Cache Python virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: buddy-venv-${{ runner.os }}-${{ steps.python.outputs.version }}-${{ hashFiles('requirements.txt') }}

      # Cache compiled objects across runs. The version/build-number defines change
      # every run but are isolated to a single TU (src/version/version.cpp), so almost
      # everything else hits the cache. PRs read the base branch's cache, so an
      # unchanged tree recompiles only what actually differs.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-coreone
          max-size: 750M

      # __DATE__/__TIME__ is used in a single firmware TU (Marlin.cpp); treat it as
      # cacheable so a new day doesn't force that object to recompile.
      - name: Configure ccache
        run: ccache --set-config sloppiness=time_macros

      - name: Download ESP NIC firmware
        uses: actions/download-artifact@v4
        with:
          name: esp-esp8266-firmware
          path: esp-fw/esp8266

      # Versioning model:
      #  * version.txt holds the Prusa base version (x.y.z) the COREONE++ project is based on.
      #  * Release tags are v<base>.<a> (e.g. v6.5.6.1), optionally with a -prerelease
      #    suffix (v6.5.6.1-beta). The 4th component <a> is the COREONE++ release number and is
      #    surfaced on the printer as "COREONE++ x.y.z.a" via -DCUSTOM_VERSION.
      #  * PR/dev builds keep the stock display (no COREONE++ version, -DEV suffix only).
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          file_version="$(tr -d '[:space:]' < version.txt)"
          custom_version=""
          if [ "$REF_TYPE" = "tag" ]; then
            ref="${REF_NAME#v}"
            core="${ref%%-*}"
            prerelease=""
            case "$REF_NAME" in
              *-*) prerelease="-${REF_NAME#*-}" ;;
            esac
            base="${core%.*}"
            custom_version="${core##*.}"
            if [ "$base" != "$file_version" ] || [ "$core" = "$base" ]; then
              echo "::error::Release tag '$REF_NAME' must be v<base>.<a> with <base> matching version.txt ($file_version), e.g. v${file_version}.1"
              exit 1
            fi
            suffix="$prerelease"
            suffix_short="$prerelease"
            full_version="${base}.${custom_version}${prerelease}"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            suffix="-DEV+${RUN_NUMBER}.PR${PR_NUMBER}"
            suffix_short="-DEV+${RUN_NUMBER}"
            full_version="${file_version}${suffix}"
          else
            branch="${REF_NAME//\//-}"
            suffix="-DEV+${RUN_NUMBER}.${branch}"
            suffix_short="-DEV+${RUN_NUMBER}"
            full_version="${file_version}${suffix}"
          fi
          safe_version="${full_version//\//-}"
          {
            echo "suffix=$suffix"
            echo "suffix_short=$suffix_short"
            echo "custom_version=$custom_version"
            echo "full_version=$full_version"
            echo "safe_version=$safe_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build firmware
        env:
          CUSTOM_VERSION: ${{ steps.version.outputs.custom_version }}
        run: |
          extra_args=()
          if [ -n "$CUSTOM_VERSION" ]; then
            extra_args+=("-DCUSTOM_VERSION:STRING=$CUSTOM_VERSION")
          fi
          python3 utils/build.py \
            --preset coreone \
            --build-type release \
            --bootloader yes \
            --generate-dfu \
            --version-suffix="${{ steps.version.outputs.suffix }}" \
            --version-suffix-short="${{ steps.version.outputs.suffix_short }}" \
            -DBUILD_NUMBER:STRING="${{ github.run_number }}" \
            -DESP_FW_BINARY_DIR:PATH="$GITHUB_WORKSPACE/esp-fw/esp8266" \
            -DCMAKE_C_COMPILER_LAUNCHER:STRING=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
            "${extra_args[@]}"

      # The .bbf is the only file flashed to the printer, so it gets its own artifact
      # for an easy, direct download. Everything else goes into a separate "extras" artifact.
      - name: Upload BBF firmware
        id: upload_bbf
        uses: actions/upload-artifact@v4
        with:
          name: coreone-bbf-${{ steps.version.outputs.safe_version }}
          path: build/products/*.bbf
          if-no-files-found: error

      - name: Upload firmware extras
        uses: actions/upload-artifact@v4
        with:
          name: coreone-extras-${{ steps.version.outputs.safe_version }}
          path: |
            build/products/*
            !build/products/*.bbf
          if-no-files-found: error

      - name: Write build summary
        env:
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
          BBF_URL: ${{ steps.upload_bbf.outputs.artifact-url }}
        run: |
          {
            echo "### Core One firmware build"
            echo ""
            echo "**Version:** \`${FULL_VERSION}\`"
            echo ""
            echo "[Download the .bbf](${BBF_URL}) — flash this file to the printer."
            echo ""
            echo "Other outputs (\`.bin\`, \`.dfu\`, \`.map\`, ELF) are in the \`coreone-extras-*\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  # Post (or update) a comment on the PR with a direct link to the freshly built .bbf.
  # Note: GITHUB_TOKEN is read-only for PRs opened from forks, so the comment is only
  # posted for same-repo PRs; the build summary link always works.
  pr-comment:
    name: PR firmware link
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: firmware
    permissions:
      pull-requests: write
    steps:
      - name: Post or update firmware download comment
        uses: actions/github-script@v7
        env:
          FULL_VERSION: ${{ needs.firmware.outputs.full_version }}
          BBF_URL: ${{ needs.firmware.outputs.bbf_artifact_url }}
        with:
          script: |
            const marker = '<!-- coreone-fw-build -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### Core One firmware build',
              '',
              `**Version:** \`${process.env.FULL_VERSION}\``,
              '',
              `[Download the \`.bbf\`](${process.env.BBF_URL}) — flash this file to the printer.`,
              '',
              `Other outputs (\`.bin\`, \`.dfu\`, \`.map\`, ELF) are in the \`coreone-extras-*\` artifact on the [run page](${runUrl}).`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # gettext provides msgfmt, used by the translator tests to generate .mo files.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Get Python version
        id: python
        run: echo "version=$(python3 -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" >> "$GITHUB_OUTPUT"

      - name: Cache buddy dependencies
        uses: actions/cache@v4
        with:
          path: .dependencies
          key: buddy-deps-${{ runner.os }}-${{ hashFiles('utils/bootstrap.py') }}

      - name: Cache Python virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: buddy-venv-${{ runner.os }}-${{ steps.python.outputs.version }}-${{ hashFiles('requirements.txt') }}

      - name: Bootstrap dependencies
        run: python3 utils/bootstrap.py

      - name: Build unit tests
        run: |
          source .venv/bin/activate
          export PATH="$(python3 utils/bootstrap.py --print-dependency-directory cmake)/bin:$PATH"
          export PATH="$(python3 utils/bootstrap.py --print-dependency-directory ninja):$PATH"
          cmake -B build-tests -G Ninja -DBOARD=BUDDY -DCMAKE_BUILD_TYPE=Debug
          ninja -C build-tests tests

      - name: Run unit tests
        run: |
          export PATH="$(python3 utils/bootstrap.py --print-dependency-directory cmake)/bin:$PATH"
          cd build-tests
          ctest --output-on-failure

  release:
    name: Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - esp-firmware
      - firmware
      - unit-tests
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Release assets:
      #  * coreone_<version>.bbf  -> direct download, flashed to the printer
      #  * coreone_<version>-extras.zip -> bin/dfu/map/ELF bundled together
      #  * esp8266-nic-firmware-<tag>.zip -> ESP NIC firmware
      - name: Prepare release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          bbf="$(ls artifacts/coreone-bbf-*/*.bbf)"
          cp "$bbf" "coreone_${version}.bbf"
          extras_dir="$(ls -d artifacts/coreone-extras-*/)"
          (cd "$extras_dir" && zip -r "$GITHUB_WORKSPACE/coreone_${version}-extras.zip" .)
          (cd artifacts/esp-esp8266-firmware && zip -r "$GITHUB_WORKSPACE/esp8266-nic-firmware-${GITHUB_REF_NAME}.zip" .)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            $prerelease_flag \
            "coreone_${version}.bbf" \
            "coreone_${version}-extras.zip" \
            "esp8266-nic-firmware-${GITHUB_REF_NAME}.zip"
